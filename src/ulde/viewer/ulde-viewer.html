<!-- src/ulde/viewer/ulde-viewer.html -->
<header class="ulde-viewer-header">
  <p>[Ulde Viewer Header1] &nbsp;</p>
  <p>[Ulde Viewer Header2] &nbsp;</p>
  <p>[Ulde Viewer Header3] &nbsp;</p>
  <p>[Ulde Viewer Header4] &nbsp;</p>
</header>

<div class="ulde-progress-bar">
  <!-- <p>Progress Bar</p> -->
  <div class="ulde-progress-bar_fill" [style.width.%]="100"></div>
  <!-- <div class="progress-bar_fill" [style.width.%]="scrollService.scrollPercent()"></div> -->
</div>

<div class="ulde-viewer-body">

  <aside class="ulde-viewer-toc" #uldeViewerTOC>

    <p>Ulde Viewer TOC</p>
    <div uldeViewerTocResizerDirective [viewerTocResizer]="$viewerTocRef()?.nativeElement"
      class="ulde-viewer-toc-resizer"></div>


    <!-- Title -->
    <h2>{{ `${$pageId()}.md` }}</h2>
    <h3 [style.padding-left.px]="7">Table of Contents</h3>

    <!-- OVERLAY (layout-level, above scroll container) -->
    <div #uldeViewerTocOverlay class="ulde-viewer-toc-overlay hidden"></div>

    <!-- SCROLL CONTAINER -->
    <div class="ulde-viewer-toc-host-container">
      <!-- RENDER CONTAINER -->
      <ul class="ulde-viewer-toc-host">
        <!-- @for (node of $tocTree(); track node.entry.slug) {
        <ng-container *ngTemplateOutlet="tocNode; context: { $implicit: node }">
        </ng-container>
        } -->
      </ul>
    </div>

    <hr>
    <button (click)="onBackToPrevPage()">
      To Previous Doc – {{ $prevPageId() }}
    </button>

  </aside>

  <!-- Markdwon Content -->
  <main class="ulde-viewer-main">
    <div #markdownHostContainer class="ulde-markdown-host-container">
      <div #markdownHostOverlay class="ulde-markdown-host-overlay hidden"></div>
      <div #markdownHost class="markdown-host"></div>
    </div>
  </main>

</div>
