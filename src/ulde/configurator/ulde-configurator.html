<!-- src/ulde/configurator/ulde-configurator.html -->

<diV class="ulde-configurator-container" #configuratorContainer>

  <div class="ulde-markdownn-viewer-container">
    <ulde-viewer [$rendererState]="$rendererState()" ($rendererStateChange)="onRendererStateChange($event)"
      ($error)="onErrorMarkdownViewer($event)">
    </ulde-viewer>
  </div>

  <!-- hidden for the time being: To be changed as Directive -->
  <div class="ulde-graph-viewer-container" draggable="true" [class.visible]="false">
    <div #graphDirective> </div>
  </div>


  <div class="ulde-devtools-viewer-container" [class.hidden]="$visibility()==='hidden' ? true : false">
    <ulde-devtools [$devtoolsSnapshot]="$devtoolsSnapshot()"></ulde-devtools>
  </div>


</diV>
