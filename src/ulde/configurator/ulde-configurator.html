<!-- src/ulde/configurator/ulde-configurator.html -->
<diV claa="ulde-configurator-container">
  <div class="ulde-markdwon-viewer-pane">
    <ulde-viewer [$rendererStateInput]="$rendererStateOfMarkdownViewer()" ($stateChange)="onMarkdownViewerStateChange($event)"
      ($error)="onErrorOfMarkdownViewer($event)">
    </ulde-viewer>
  </div>

  
  <div class="ulde-devtools-viewer-pane">
    <ulde-devtools [$rendererState]="$rendererStateOfDevtoolsViewer()"></ulde-devtools>
  </div>


</diV>
